<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter ma voiture</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .filtres { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .filtres > div { display: flex; flex-direction: column; }
    label { font-size: 12px; margin-bottom: 3px; }
    #sqlInsertion { background: #f4f4f4; padding: 10px; white-space: pre-wrap; font-family: monospace; margin-top: 10px; }
    #messageInsertion { font-weight: bold; color: #1a7f37; }
  </style>
</head>
<body>

  <p><a href="index.html">&larr; Retour au catalogue de voitures</a></p>

  <h1>Ajouter ma voiture</h1>
  <p>Remplis les champs puis clique sur « Générer la requête ».
    Copie ensuite la requête dans SSMS pour insérer ta voiture dans la base.</p>

  <div class="filtres">
    <div>
      <label>Marque</label>
      <select id="iMarque"></select>
    </div>
    <div>
      <label>Modèle</label>
      <select id="iModele"></select>
    </div>
    <div>
      <label>Année</label>
      <input type="number" id="iAnnee" value="2020">
    </div>
    <div>
      <label>Prix (CHF)</label>
      <input type="number" id="iPrix" value="25000">
    </div>
    <div>
      <label>Motorisation</label>
      <select id="iMotorisation"></select>
    </div>
    <div>
      <label>Boîte</label>
      <select id="iBoite"></select>
    </div>
    <div>
      <label>Portes</label>
      <select id="iPortes"><option>2</option><option>3</option><option>4</option><option selected>5</option></select>
    </div>
  </div>
  <button onclick="genererInsertion()">Générer la requête</button>
  <span id="messageInsertion"></span>

    const MARQUES = Object.keys(GAMME_MARQUE).sort();

    // ===== Remplir les menus deroulants =====
    function remplirMenu(id, valeurs) {
      const select = document.getElementById(id);
      select.innerHTML = "";
      valeurs.forEach(function(v) {
        const option = document.createElement("option");
        option.value = v;
        option.textContent = v;
        select.appendChild(option);
      });
    }
    function remplirModeles() {
      const marque = document.getElementById("iMarque").value;
      remplirMenu("iModele", MODELES.filter(function(m) { return m[0] === marque; }).map(function(m) { return m[1]; }));
    }
    remplirMenu("iMarque", MARQUES);
    remplirMenu("iMotorisation", MOTORISATIONS);
    remplirMenu("iBoite", BOITES);
    document.getElementById("iMarque").addEventListener("change", remplirModeles);
    remplirModeles();

    // ===== Construire la requete d'insertion =====
    function genererInsertion() {
      const message = document.getElementById("messageInsertion");
      const voiture = {
        marque: document.getElementById("iMarque").value,
        modele: document.getElementById("iModele").value,
        annee: Number(document.getElementById("iAnnee").value),
        prix: Number(document.getElementById("iPrix").value),
        motorisation: document.getElementById("iMotorisation").value,
        boite: document.getElementById("iBoite").value,
        portes: Number(document.getElementById("iPortes").value)
      };

      // Verifications simples (comme les contraintes CHECK de la base)
      if (!Number.isInteger(voiture.annee) || voiture.annee < 1960 || voiture.annee > ANNEE_MAX) {
        message.style.color = "#c00";
        message.textContent = " L'année doit être entre 1960 et " + ANNEE_MAX + ".";
        return;
      }
      if (!Number.isInteger(voiture.prix) || voiture.prix <= 0) {
        message.style.color = "#c00";
        message.textContent = " Le prix doit être un nombre entier positif.";
        return;
      }
      message.style.color = "";
      message.textContent = " Requête prête ! Copie-la dans SSMS.";

      // Requete d'insertion + requete pour voir la ligne inseree
      const texte = function(v) { return "'" + String(v).replace(/'/g, "''") + "'"; };
      let sql = "-- 1) Ajouter la voiture dans la base\n";
      sql += "INSERT INTO t_voiture (modele, annee, prix, motorisation, boite_vitesse, nb_portes, marque_fk)\n";
      sql += "SELECT " + texte(voiture.modele) + ", " + voiture.annee + ", " + voiture.prix + ", " +
        texte(voiture.motorisation) + ", " + texte(voiture.boite) + ", " + voiture.portes + ", marque_id\n";
      sql += "FROM t_marque\n";
      sql += "WHERE nom_marque = " + texte(voiture.marque) + ";\n\n";
      sql += "-- 2) Voir la voiture qu'on vient d'ajouter (la derniere voiture_id)\n";
      sql += "SELECT v.voiture_id, v.modele, m.nom_marque, v.annee, v.prix, v.motorisation, v.boite_vitesse, v.nb_portes\n";
      sql += "FROM t_voiture v\n";
      sql += "JOIN t_marque m ON v.marque_fk = m.marque_id\n";
      sql += "WHERE v.voiture_id = (SELECT MAX(voiture_id) FROM t_voiture);";
      document.getElementById("sqlInsertion").textContent = sql;
    }

    // ===== Copier le texte SQL dans le presse-papier =====
    function copierSql() {
      const texte = document.getElementById("sqlInsertion").textContent;
      navigator.clipboard.writeText(texte).then(function() {
        document.getElementById("messageCopie").textContent = " Copié !";
        setTimeout(function() {
          document.getElementById("messageCopie").textContent = "";
        }, 2000);
      });
    }
  </script>
