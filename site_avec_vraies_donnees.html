<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon catalogue de voitures</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .filtres { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .filtres > div { display: flex; flex-direction: column; }
    label { font-size: 12px; margin-bottom: 3px; }
    #sql { background: #f4f4f4; padding: 10px; white-space: pre-wrap; font-family: monospace; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    .chrono { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    #affichageChrono { font-family: monospace; font-size: 24px; }
  </style>
</head>
<body>

  <h1>Catalogue de voitures</h1>

  <div class="chrono">
    <span id="affichageChrono">00:00.00</span>
    <button id="boutonChrono" onclick="basculerChrono()">Démarrer</button>
  </div>

  <div class="filtres">
    <div>
      <label>Marque</label>
      <select id="fMarque"><option value="">Toutes</option></select>
    </div>
    <div>
      <label>Prix min</label>
      <input type="number" id="fPrixMin">
    </div>
    <div>
      <label>Prix max</label>
      <input type="number" id="fPrixMax">
    </div>
    <div>
      <label>Année min</label>
      <input type="number" id="fAnneeMin">
    </div>
    <div>
      <label>Année max</label>
      <input type="number" id="fAnneeMax">
    </div>
    <div>
      <label>Motorisation</label>
      <select id="fMotorisation">
        <option value="">Toutes</option>
        <option>Essence</option>
        <option>Diesel</option>
        <option>Hybride</option>
        <option>Hybride rechargeable</option>
        <option>Électrique</option>
        <option>Mild-hybride</option>
        <option>GPL</option>
      </select>
    </div>
    <div>
      <label>Boîte</label>
      <select id="fBoite">
        <option value="">Toutes</option>
        <option>Manuelle</option>
        <option>Automatique</option>
        <option>Semi-automatique</option>
        <option>CVT</option>
      </select>
    </div>
    <div>
      <label>Portes</label>
      <select id="fPortes">
        <option value="">Toutes</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
      </select>
    </div>
  </div>

  <p><strong id="compteur">Génération des voitures...</strong> <span id="infoAffichage"></span></p>
  <table id="tableauResultats">
    <thead>
      <tr><th>Modèle</th><th>Marque</th><th>Année</th><th>Prix</th><th>Motorisation</th><th>Boîte</th><th>Portes</th></tr>
    </thead>
    <tbody id="resultats"></tbody>
  </table>

  <h2>Requête SQL à copier dans SSMS</h2>
  <div id="sql"></div>
  <button onclick="copierSql()">Copier la requête</button>

      ["Lincoln", "Navigator", "SUV", 0], ["Lincoln", "Aviator", "SUV", 0], ["Lincoln", "Corsair", "SUV", 0], ["Lincoln", "Nautilus", "SUV", 0],
      ["Genesis", "G70", "Berline", 0], ["Genesis", "G80", "Berline", 0], ["Genesis", "G90", "Berline", 0], ["Genesis", "GV60", "SUV", 1], ["Genesis", "GV70", "SUV", 0], ["Genesis", "GV80", "SUV", 0],
      ["Polestar", "Polestar 2", "Berline", 1], ["Polestar", "Polestar 3", "SUV", 1], ["Polestar", "Polestar 4", "SUV", 1],
      ["Rivian", "R1T", "Pick-up", 1], ["Rivian", "R1S", "SUV", 1],
      ["Lucid", "Air", "Berline", 1], ["Lucid", "Gravity", "SUV", 1],
      ["BYD", "Atto 3", "SUV", 1], ["BYD", "Seal", "Berline", 1], ["BYD", "Dolphin", "Compacte", 1], ["BYD", "Han", "Berline", 1], ["BYD", "Tang", "SUV", 1], ["BYD", "Seal U", "SUV", 1],
      ["MG", "ZS", "SUV", 0], ["MG", "MG4", "Compacte", 1], ["MG", "MG5", "Break", 1], ["MG", "HS", "SUV", 0], ["MG", "MG3", "Citadine", 0], ["MG", "Cyberster", "Cabriolet", 1],
      ["Isuzu", "D-Max", "Pick-up", 0], ["Isuzu", "MU-X", "SUV", 0]
    ];

    const MOTORISATIONS = ["Essence", "Diesel", "Hybride", "Mild-hybride", "Hybride rechargeable", "Électrique", "GPL"];
    const BOITES = ["Manuelle", "Automatique", "Semi-automatique", "CVT"];
    const MARQUES = Object.keys(GAMME_MARQUE).sort();
    const marqueDuModele = MODELES.map(function(m) { return MARQUES.indexOf(m[0]); });

    // Generateur aleatoire avec graine fixe : les memes voitures a chaque chargement
    let graine = 141;
    function aleatoire() {
      graine = (graine + 0x6D2B79F5) | 0;
      let t = Math.imul(graine ^ (graine >>> 15), 1 | graine);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) & 0x7FFFFFFF; // entier positif, comme CHECKSUM(NEWID()) & 2147483647
    }

    // Stockage en colonnes (tableaux types) : 1 million d'objets JS serait trop lourd en memoire
    const vModele = new Uint16Array(NB_VOITURES);
    const vAnnee = new Uint16Array(NB_VOITURES);
    const vPrix = new Uint32Array(NB_VOITURES);
    const vMotorisation = new Uint8Array(NB_VOITURES);
    const vBoite = new Uint8Array(NB_VOITURES);
    const vPortes = new Uint8Array(NB_VOITURES);

    for (let i = 0; i < NB_VOITURES; i++) {
      const idxModele = aleatoire() % MODELES.length;
      const m = MODELES[idxModele];
      const carrosserie = m[2], electrique = m[3] === 1, gamme = GAMME_MARQUE[m[0]];
      const r1 = aleatoire(), r2 = aleatoire(), r4 = aleatoire(), r6 = aleatoire(), r7 = aleatoire(), r12 = aleatoire();

      // annee : electriques des 2012, 10 % d'anciennes (1960-2004), sinon 2005-aujourd'hui
      let annee;
      if (electrique) annee = 2012 + r1 % (ANNEE_MAX - 2011);
      else if (r12 % 10 === 0) annee = 1960 + r1 % 45;
      else annee = 2005 + r1 % (ANNEE_MAX - 2004);

      // motorisation : pas d'hybride avant 2000
      let motorisation;
      if (electrique) motorisation = "Électrique";
      else if (annee < 2000) motorisation = r2 % 3 === 0 ? "Diesel" : "Essence";
      else if (r2 % 100 < 35) motorisation = "Essence";
      else if (r2 % 100 < 60) motorisation = "Diesel";
      else if (r2 % 100 < 75) motorisation = "Hybride";
      else if (r2 % 100 < 85) motorisation = "Mild-hybride";
      else if (r2 % 100 < 95) motorisation = "Hybride rechargeable";
      else motorisation = "GPL";

      // prix de base selon la gamme + devaluation (-2.5 %/an, min 25 %), arrondi a la centaine
      let base;
      if (gamme === 1) base = 8000 + r4 % 32001;
      else if (gamme === 2) base = 15000 + r4 % 65001;
      else if (gamme === 3) base = 30000 + r4 % 120001;
      else base = 90000 + r4 % 260001;
      const facteur = Math.max(0.25, 1 - (ANNEE_MAX - annee) * 0.025);
      const prix = Math.max(1000, Math.round(base * facteur / 100) * 100);

      // boite de vitesses
      let boite;
      if (motorisation === "Électrique") boite = "Automatique";
      else if (annee < 1990) boite = "Manuelle";
      else if (r6 % 10 < 4) boite = "Manuelle";
      else if (r6 % 10 < 8) boite = "Automatique";
      else if (r6 % 10 === 8) boite = "Semi-automatique";
      else boite = "CVT";

      // nombre de portes selon la carrosserie
      let portes;
      if (carrosserie === "Coupé" || carrosserie === "Cabriolet") portes = 2;
      else if (carrosserie === "Citadine" || carrosserie === "Compacte") portes = r7 % 3 === 0 ? 3 : 5;
      else if (carrosserie === "Berline" || carrosserie === "Pick-up") portes = 4;
      else portes = 5;

      vModele[i] = idxModele;
      vAnnee[i] = annee;
      vPrix[i] = prix;
      vMotorisation[i] = MOTORISATIONS.indexOf(motorisation);
      vBoite[i] = BOITES.indexOf(boite);
      vPortes[i] = portes;
    }

    // Ordre des voitures trie par prix croissant (comme le ORDER BY v.prix ASC du SQL).
    // Tri par comptage : les prix sont des multiples de 100, donc tres rapide.
    const ordreParPrix = (function() {
      const nbCases = 350000 / 100 + 1;
      const debutCase = new Uint32Array(nbCases + 1);
      for (let i = 0; i < NB_VOITURES; i++) debutCase[vPrix[i] / 100 + 1]++;
      for (let c = 1; c <= nbCases; c++) debutCase[c] += debutCase[c - 1];
      const ordre = new Uint32Array(NB_VOITURES);
      for (let i = 0; i < NB_VOITURES; i++) ordre[debutCase[vPrix[i] / 100]++] = i;
      return ordre;
    })();

    // ===== Remplir le menu deroulant Marque =====
    const selectMarque = document.getElementById("fMarque");
    MARQUES.forEach(function(m) {
      const option = document.createElement("option");
      option.value = m;
      option.textContent = m;
      selectMarque.appendChild(option);
    });

    // ===== Chaque filtre relance filtrer() des qu'on le change =====
    const idsFiltres = ["fMarque","fPrixMin","fPrixMax","fAnneeMin","fAnneeMax","fMotorisation","fBoite","fPortes"];
    idsFiltres.forEach(function(id) {
      document.getElementById(id).addEventListener("input", filtrerBientot);
      document.getElementById(id).addEventListener("change", filtrerBientot);
    });

    // Attend que la personne ait fini de taper avant de filtrer le million de voitures
    let minuteurFiltre = null;
    function filtrerBientot() {
      clearTimeout(minuteurFiltre);
      minuteurFiltre = setTimeout(filtrer, 200);
    }

    function filtrer() {
      // 1. Lire la valeur de chaque filtre
      const marque = document.getElementById("fMarque").value;
      const prixMin = document.getElementById("fPrixMin").value;
      const prixMax = document.getElementById("fPrixMax").value;
      const anneeMin = document.getElementById("fAnneeMin").value;
      const anneeMax = document.getElementById("fAnneeMax").value;
      const motorisation = document.getElementById("fMotorisation").value;
      const boite = document.getElementById("fBoite").value;
      const portes = document.getElementById("fPortes").value;

      // 2. Filtrer les voitures (parcourues par prix croissant)
      const idxMarque = marque ? MARQUES.indexOf(marque) : -1;
      const idxMotorisation = motorisation ? MOTORISATIONS.indexOf(motorisation) : -1;
      const idxBoite = boite ? BOITES.indexOf(boite) : -1;
      const pMin = prixMin ? Number(prixMin) : -Infinity;
      const pMax = prixMax ? Number(prixMax) : Infinity;
      const aMin = anneeMin ? Number(anneeMin) : -Infinity;
      const aMax = anneeMax ? Number(anneeMax) : Infinity;
      const nbPortes = portes ? Number(portes) : -1;

      let nbResultats = 0;
      let lignes = "";
      for (let k = 0; k < NB_VOITURES; k++) {
        const i = ordreParPrix[k];
        if (idxMarque >= 0 && marqueDuModele[vModele[i]] !== idxMarque) continue;
        if (vPrix[i] < pMin || vPrix[i] > pMax) continue;
        if (vAnnee[i] < aMin || vAnnee[i] > aMax) continue;
        if (idxMotorisation >= 0 && vMotorisation[i] !== idxMotorisation) continue;
        if (idxBoite >= 0 && vBoite[i] !== idxBoite) continue;
        if (nbPortes >= 0 && vPortes[i] !== nbPortes) continue;
        nbResultats++;
        if (nbResultats <= MAX_LIGNES_AFFICHEES) {
          const m = MODELES[vModele[i]];
          lignes += "<tr><td>" + m[1] + "</td><td>" + m[0] + "</td><td>" + vAnnee[i] + "</td><td>" +
            vPrix[i] + " CHF</td><td>" + MOTORISATIONS[vMotorisation[i]] + "</td><td>" +
            BOITES[vBoite[i]] + "</td><td>" + vPortes[i] + "</td></tr>";
        }
      }

      // 3. Afficher le tableau de resultats (seulement les premieres lignes, sinon le navigateur bloque)
      document.getElementById("compteur").textContent =
        nbResultats.toLocaleString("fr-CH") + " / " + NB_VOITURES.toLocaleString("fr-CH") + " voitures";
      document.getElementById("infoAffichage").textContent = nbResultats > MAX_LIGNES_AFFICHEES
        ? "(affichage des " + MAX_LIGNES_AFFICHEES + " moins chères)" : "";
      document.getElementById("resultats").innerHTML = lignes;

      // 4. Construire le texte de la requete SQL en fonction des filtres actifs
      const conditions = [];
      if (marque) conditions.push("m.nom_marque = '" + marque + "'");
      if (prixMin) conditions.push("v.prix >= " + Number(prixMin));
      if (prixMax) conditions.push("v.prix <= " + Number(prixMax));
      if (anneeMin) conditions.push("v.annee >= " + Number(anneeMin));
      if (anneeMax) conditions.push("v.annee <= " + Number(anneeMax));
      if (motorisation) conditions.push("v.motorisation = '" + motorisation + "'");
      if (boite) conditions.push("v.boite_vitesse = '" + boite + "'");
      if (portes) conditions.push("v.nb_portes = " + portes);

      let sql = "SELECT v.modele, m.nom_marque, v.annee, v.prix, v.motorisation, v.boite_vitesse, v.nb_portes\n";
      sql += "FROM t_voiture v\n";
      sql += "JOIN t_marque m ON v.marque_fk = m.marque_id\n";
      if (conditions.length > 0) {
        sql += "WHERE " + conditions.join("\n  AND ") + "\n";
      }
      sql += "ORDER BY v.prix ASC;";

      document.getElementById("sql").textContent = sql;
    }

    // ===== Copier le texte SQL dans le presse-papier =====
    function copierSql() {
      const texte = document.getElementById("sql").textContent;
      navigator.clipboard.writeText(texte).then(function() {
        document.getElementById("messageCopie").textContent = " Copié !";
        setTimeout(function() {
          document.getElementById("messageCopie").textContent = "";
        }, 2000);
      });
    }

    // ===== Chronometre : Demarrer repart de zero, Arreter fige le temps =====
    let debutChrono = null;
    let intervalleChrono = null;

    function afficherChrono(ms) {
      const minutes = Math.floor(ms / 60000);
      const secondes = Math.floor((ms % 60000) / 1000);
      const centiemes = Math.floor((ms % 1000) / 10);
      document.getElementById("affichageChrono").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(secondes).padStart(2, "0") + "." +
        String(centiemes).padStart(2, "0");
    }

    function basculerChrono() {
      const bouton = document.getElementById("boutonChrono");
      if (intervalleChrono === null) {
        debutChrono = Date.now();
        afficherChrono(0);
        intervalleChrono = setInterval(function() {
          afficherChrono(Date.now() - debutChrono);
        }, 10);
        bouton.textContent = "Arrêter";
      } else {
        clearInterval(intervalleChrono);
        intervalleChrono = null;
        afficherChrono(Date.now() - debutChrono);
        bouton.textContent = "Démarrer";
      }
    }

    filtrer(); // Affiche tout au chargement
  </script>
